services:
  # ① データベース（PostgreSQL）のコンテナ
  db:
    image: postgres:15-alpine
    container_name: aomori_postgres_db
    restart: always
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: aomori_bgm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ② バックエンド（FastAPI）のコンテナ
  web:
    build: .
    container_name: aomori-bgm-backend-web-1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://db_user:db_password@db:5432/aomori_bgm_db

volumes:
  postgres_data:
