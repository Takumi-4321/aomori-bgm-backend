<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aomori BGM App</title>
    <style>
      /* 🎨 あとでピカピカにするための最低限のシンプルなデザイン */
      body {
        font-family: sans-serif;
        margin: 40px;
        background: #f4f6f9;
        color: #333;
      }
      .login-container {
        background: white;
        padding: 30px;
        border-radius: 8px;
        max-width: 400px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .form-group input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <h1>🎵 Aomori BGM アプリ</h1>

    <!-- 👤 ログインフォームのエリア -->
    <div class="login-container">
      <h2>ログイン</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input
            type="email"
            id="email"
            required
            placeholder="example@example.com"
          />
        </div>
        <div class="form-group">
          <label for="password">パスワード</label>
          <input
            type="password"
            id="password"
            required
            placeholder="••••••••"
          />
        </div>
        <button type="submit">ログインする</button>
      </form>
    </div>

    <!-- JavaScriptファイルを読み込む -->
    <script src="app.js"></script>
  </body>
</html>
