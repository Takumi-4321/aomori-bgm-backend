<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aomori BGM App</title>
    <style>
      /* 🎨 シンプルでモダンなデザイン */
      body {
        font-family: sans-serif;
        margin: 40px;
        background: #f4f6f9;
        color: #333;
      }
      .container {
        background: white;
        padding: 30px;
        border-radius: 8px;
        max-width: 500px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .form-group input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      .logout-btn {
        background: #dc3545;
        margin-top: 15px;
      }
      .logout-btn:hover {
        background: #c82333;
      }

      /* 🎵 BGMリストのスタイル */
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        background: #f8f9fa;
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 4px;
        border-left: 4px solid #007bff;
      }

      /* 🌟 画面切り替え用の非表示クラス */
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>🎵 Aomori BGM アプリ</h1>

    <!-- 👤 ① ログインフォーム（最初はこれだけ見える） -->
    <div id="loginSection" class="container">
      <h2>ログイン</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input
            type="email"
            id="email"
            required
            placeholder="example@example.com"
          />
        </div>
        <div class="form-group">
          <label for="password">パスワード</label>
          <input
            type="password"
            id="password"
            required
            placeholder="••••••••"
          />
        </div>
        <button type="submit">ログインする</button>
      </form>
    </div>

    <!-- 🎸 ② 会員専用エリア（ログイン成功後に現れる！） -->
    <div id="memberSection" class="container hidden">
      <h2>🔓 会員専用ページ</h2>
      <p>ログインに成功しました！登録されているBGM一覧です。</p>

      <!-- BGM一覧がここに並ぶ -->
      <ul id="bgmList"></ul>

      <button id="logoutBtn" class="logout-btn">ログアウト</button>
    </div>

    <!-- JavaScriptファイルを読み込む -->
    <script src="app.js"></script>
  </body>
</html>
